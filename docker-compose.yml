# Docker Compose конфигурация для конструктора Telegram-ботов
# Запускает приложение и PostgreSQL базу данных одной командой
# Usage: docker compose up -d

services:
  # База данных PostgreSQL для хранения проектов и настроек
  db:
    image: postgres:15-alpine
    container_name: bot-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bot-builder-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Основное приложение (конструктор ботов)
  # image — прод/CI (GHCR); build — локальная разработка (docker compose build)
  app:
    image: ghcr.io/hojjatsa/telegram-bot-builder:${IMAGE_TAG:-golnoor}
    build: .
    # Production should always refresh the mutable golnoor tag on redeploy.
    # For local offline development APP_PULL_POLICY=never can be used explicitly.
    pull_policy: ${APP_PULL_POLICY:-always}
    container_name: bot-builder-app
    restart: unless-stopped
    stop_grace_period: 45s
    # 0 = без лимита (по умолчанию). На маленьких VPS задайте APP_MEM_LIMIT=1280m в .env
    mem_limit: ${APP_MEM_LIMIT:-0}
    memswap_limit: ${APP_MEM_LIMIT:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      PGHOST: "${PGHOST}"
      PGPORT: "${PGPORT}"
      PGDATABASE: "${PGDATABASE}"
      PGUSER: "${PGUSER}"
      PGPASSWORD: "${PGPASSWORD}"
      PGSSLMODE: "${PGSSLMODE}"
      SESSION_SECRET: "${SESSION_SECRET}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      NODE_ENV: "${NODE_ENV}"
      PORT: "${PORT}"
      HOST: "${HOST}"
      REDIS_URL: "${REDIS_URL}"
      # Optional Telegram relays for restricted networks. Empty = official Telegram endpoints.
      TELEGRAM_API_BASE_URL: "${TELEGRAM_API_BASE_URL:-}"
      TELEGRAM_PROXY_URL: "${TELEGRAM_PROXY_URL:-}"
      TELEGRAM_JWKS_URL: "${TELEGRAM_JWKS_URL:-}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5000/api/health').then(async r=>{const j=await r.json();if(!r.ok||!j.ready)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./bots:/app/bots

volumes:
  postgres_data:
    name: bot-builder-postgres-data
  redis_data:
    name: bot-builder-redis-data
