name: Build Golnoor image

on:
  push:
    branches:
      - golnoor
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-golnoor-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/hojjatsa/telegram-bot-builder:golnoor
            ghcr.io/hojjatsa/telegram-bot-builder:latest-golnoor
            ghcr.io/hojjatsa/telegram-bot-builder:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
