            'Файлы не найдены': 'No files found',
            'Нет загруженных файлов': 'No uploaded files',
            'Редактировать файл': 'Edit file',
            'Измените описание и теги для этого медиа файла': 'Edit the description and tags for this media file',
            'Описание файла': 'File description',
            'Теги (через запятую)': 'Tags (comma-separated)',
            'тег1, тег2, тег3': 'tag1, tag2, tag3',
            'Фото загружено': 'Photo uploaded',
          }

          pattern = re.compile(r"(?P<q>['\"`])(?P<body>(?:\\.|(?!\1).)*?)(?P=q)", re.S)
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.html'}
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in extensions:
                  continue
              if '/tests/' in str(path) or '.test.' in path.name:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              original = text

              def replace_string(match):
                  body = match.group('body')
                  target = translations.get(body)
                  if target is None:
                      return match.group(0)
                  q = match.group('q')
                  return f'{q}{target}{q}'

              text = pattern.sub(replace_string, text)
              for source, target in sorted(translations.items(), key=lambda item: -len(item[0])):
                  if '<' in source or '>' in source:
                      continue
                  text = re.sub(
                      r'(>\s*)' + re.escape(source) + r'(\s*<)',
                      lambda match, value=target: match.group(1) + value + match.group(2),
                      text,
                  )
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Translated {len(changed)} files in pass 2')

      - name: Commit pass 2
        run: |
          if git diff --quiet -- client; then
            echo "No changes"
            exit 0
          fi
          git config user.name "hojjat saadatmand"
          git config user.email "hojjat.sa@gmail.com"
          git add client
          git commit -m "feat(i18n): translate editor properties and media UI"
          git push origin golnoor
