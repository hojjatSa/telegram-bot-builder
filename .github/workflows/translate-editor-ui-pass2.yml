name: Translate Editor UI Pass 2

on:
  push:
    branches:
      - golnoor
    paths:
      - .github/workflows/translate-editor-ui-pass2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: golnoor
          fetch-depth: 0

