            'Бот ${token.id}': 'Bot ${token.id}',
            'Проект ${index + 1}': 'Project ${index + 1}',
          }

          string_pattern = re.compile(r"(?P<q>['\"`])(?P<body>(?:\\.|(?!\1).)*?)(?P=q)", re.S)
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.html'}
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in extensions:
                  continue
              path_text = str(path)
              if '/tests/' in path_text or '.test.' in path.name:
                  continue

              text = path.read_text(encoding='utf-8', errors='ignore')
              original = text

              def replace_string(match):
                  body = match.group('body')
                  translated = translations.get(body)
                  if translated is None:
                      return match.group(0)
                  quote = match.group('q')
                  return f'{quote}{translated}{quote}'

              text = string_pattern.sub(replace_string, text)

              for source, target in sorted(translations.items(), key=lambda item: -len(item[0])):
                  if '<' in source or '>' in source:
                      continue
                  text = re.sub(
                      r'(>\s*)' + re.escape(source) + r'(\s*<)',
                      lambda match, value=target: match.group(1) + value + match.group(2),
                      text,
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Translated {len(changed)} client files')
          for path in changed:
              print(path)

      - name: Commit translation pass
        run: |
          if git diff --quiet -- client; then
            echo "No translation changes to commit"
            exit 0
          fi
          git config user.name "hojjat saadatmand"
          git config user.email "hojjat.sa@gmail.com"
          git add client
          git commit -m "feat(i18n): translate editor UI strings to English"
          git push origin golnoor
