name: Apply Curated UI Translations

on:
  push:
    branches:
      - golnoor
    paths:
      - scripts/apply-curated-ui-translations.py
      - .github/workflows/apply-curated-ui-translations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Golnoor
        uses: actions/checkout@v5
        with:
          ref: golnoor
          fetch-depth: 0

      - name: Apply curated translation maps
        run: python scripts/apply-curated-ui-translations.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build client
        run: npm run build:client

      - name: Commit translated UI
        shell: bash
        run: |
          if git diff --quiet -- client; then
            echo "No curated translation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client
          git commit -m "feat(i18n): apply curated English UI translations"
          git push origin HEAD:golnoor
