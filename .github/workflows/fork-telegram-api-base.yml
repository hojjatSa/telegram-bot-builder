name: Fork Telegram API base guard

on:
  pull_request:
    paths:
      - 'server/utils/telegram-api-base.ts'
      - 'server/utils/telegram-api-base.test.ts'
      - 'server/utils/telegram-proxy.ts'
      - 'lib/templates/config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fork-telegram-api-base.yml'
  push:
    branches: [main]
    paths:
      - 'server/utils/telegram-api-base.ts'
      - 'server/utils/telegram-api-base.test.ts'
      - 'server/utils/telegram-proxy.ts'
      - 'lib/templates/config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fork-telegram-api-base.yml'

permissions:
  contents: read

jobs:
  telegram-api-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Telegram API base URL extension
        run: >-
          node --import tsx --test
          server/utils/telegram-api-base.test.ts
          lib/templates/config/telegram-api-base-url.test.ts
