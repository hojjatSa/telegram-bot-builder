name: Fork compatibility guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/utils/telegram-api-base.ts'
      - 'server/utils/telegram-api-base.test.ts'
      - 'server/utils/telegram-proxy.ts'
      - 'server/fork/**'
      - 'server/admin/setup-admin-routes.ts'
      - 'client/fork/**'
      - 'client/components/admin/pages/admin-overview.tsx'
      - 'lib/templates/config/**'
      - 'lib/templates/typed-renderer.ts'
      - 'lib/bot-generator.ts'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fork-telegram-api-base.yml'
  push:
    branches: [golnoor]
    paths:
      - 'server/utils/telegram-api-base.ts'
      - 'server/utils/telegram-api-base.test.ts'
      - 'server/utils/telegram-proxy.ts'
      - 'server/fork/**'
      - 'server/admin/setup-admin-routes.ts'
      - 'client/fork/**'
      - 'client/components/admin/pages/admin-overview.tsx'
      - 'lib/templates/config/**'
      - 'lib/templates/typed-renderer.ts'
      - 'lib/bot-generator.ts'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/fork-telegram-api-base.yml'

permissions:
  contents: read

jobs:
  fork-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test fork Telegram integration
        run: >-
          node --import tsx --test
          server/utils/telegram-api-base.test.ts
          server/fork/telegram-gateway/diagnostics.test.ts
          lib/templates/config/telegram-api-base-url.test.ts

      - name: Load fork server registry
        run: node --import tsx -e "import('./server/fork/index.ts')"

      - name: Validate compose configuration
        run: docker compose -f docker-compose.yml config >/dev/null
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          DATABASE_URL: postgresql://test:test@db:5432/test
          PGHOST: db
          PGPORT: '5432'
          PGDATABASE: test
          PGUSER: test
          PGPASSWORD: test
          PGSSLMODE: disable
          SESSION_SECRET: test-test-test-test-test-test-test-test
          ADMIN_API_KEY: test-test-test-test-test-test-test-test
          NODE_ENV: production
          PORT: '5000'
          HOST: 0.0.0.0
          REDIS_URL: redis://redis:6379
          TELEGRAM_API_BASE_URL: https://example.invalid
          TELEGRAM_PROXY_URL: ''
          TELEGRAM_JWKS_URL: https://example.invalid/oauth/jwks

      - name: Build client
        run: npm run build:client
