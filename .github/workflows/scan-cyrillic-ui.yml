name: Scan Cyrillic UI

on:
  push:
    branches:
      - golnoor
    paths:
      - .github/workflows/scan-cyrillic-ui.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan client UI for Cyrillic text
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [Path('client')]
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.html'}
          cyr = re.compile(r'[А-Яа-яЁё]')
          rows = []
          files = set()

          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in extensions:
                      continue
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  in_block_comment = False
                  for line_no, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if stripped.startswith('/*'):
                          in_block_comment = True
                      if in_block_comment:
                          if '*/' in stripped:
                              in_block_comment = False
                          continue
                      if stripped.startswith('//') or stripped.startswith('*'):
                          continue
                      if cyr.search(line):
                          rows.append((str(path), line_no, stripped))
                          files.add(str(path))

          print(f'CYRILLIC_UI_FILES={len(files)}')
          print(f'CYRILLIC_UI_LINES={len(rows)}')
          print('--- CYRILLIC UI INVENTORY ---')
          for path, line_no, text in rows:
              print(f'{path}:{line_no}: {text}')
